[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-learning-for-biology"
version = "0.1.0"
description = "Personal code and notes for studying Deep Learning for Biology."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Official runtime requirements at dlfb commit 3480947.
    "adjusttext==1.3.0",
    "biopython==1.85",
    "click<8.2",
    "datasets==2.19.1",
    "dlfb",
    "dm-pix==0.4.4",
    "flax==0.10.4",
    "google-cloud-storage==3.0.0",
    "huggingface-hub==0.36.0",
    "ipinfo==5.1.1",
    "jax==0.5.1",
    "jaxlib==0.5.1",
    "jraph==0.0.6.dev0",
    "matplotlib==3.10.1",
    "ml-collections==0.1.1",
    "ml-dtypes==0.5.1",
    "numpy==2.1.2",
    "obonet==1.0.0",
    "ogb==1.3.6",
    "optax==0.2.4",
    "orbax-checkpoint==0.11.9",
    "pandas==2.2.2",
    "parfive==2.2.0",
    "py3dmol==2.1.0",
    "scikit-learn==1.4.2",
    "seaborn==0.13.2",
    "tensorflow==2.19.0",
    "tensorflow-datasets==4.9.8",
    "tensorstore==0.1.72",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "traitlets==5.7.1",
    "transformers==4.49.0",
    "typer==0.7.0",
    "umap-learn==0.5.6",
    # Local notebook tools and compatibility pins.
    "ipykernel==6.29.5",
    "ipython==8.18.1",
    "jupyterlab==4.3.5",
    "numba==0.61.2",
    "pyarrow==19.0.1",
    "scipy==1.15.3",
    "setuptools==75.8.2",
    "tensorflow-metadata==1.16.1",
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

[tool.setuptools]
py-modules = ["book_runtime"]

[tool.uv.sources]
dlfb = { git = "https://github.com/deep-learning-for-biology/dlfb.git", rev = "34809479cab19295902dcd70159dbb07f6ad403f" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
